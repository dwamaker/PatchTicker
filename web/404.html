    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 0.25rem; }
    .links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border: 1px solid var(--edge); border-radius: 8px; color: var(--ink); font-size: 0.875rem; font-weight: 500; text-decoration: none; }
