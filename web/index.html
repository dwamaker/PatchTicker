<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vuln-radar</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 90rem; margin: 0 auto; padding: 1rem; color: #222; background: #fff; }
    h2 { font-size: 1.125rem; margin: 1rem 0 0.5rem; }
    #status, footer { color: #666; font-size: 0.875rem; }
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; }
    header #lang { justify-self: end; }
    #lang, #views button { font: inherit; min-height: 44px; padding: 0 1rem; }
    #views { display: inline-flex; }
    #views button { border: 1px solid #333; background: #fff; color: #333; }
    #views button + button { border-left: 0; }
    #views button[aria-pressed="true"] { background: #333; color: #fff; font-weight: 600; }
    @media (max-width: 480px) { header { grid-template-columns: 1fr auto; } #views { grid-column: 1 / -1; grid-row: 2; justify-self: center; } }
    #filter { display: grid; gap: 0.5rem; max-width: 48rem; }
    #filter input { font: inherit; padding: 0.5rem; min-height: 44px; box-sizing: border-box; width: 100%; }
    #picks { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    #picks button { font: inherit; min-height: 44px; padding: 0 0.75rem; }
    .cols { display: grid; grid-template-columns: 7rem 10rem minmax(0, 1fr) minmax(6rem, 20rem) 6rem; gap: 0 1rem; align-items: baseline; }
    #board-head { font-size: 0.8125rem; font-weight: 600; color: #555; padding: 0.375rem 0.5rem; border-top: 2px solid #333; border-bottom: 1px solid #999; }
    .board { list-style: none; padding: 0; margin: 0; }
    .board > li { border-bottom: 1px solid #e3e3e3; }
    .row { font: inherit; color: inherit; background: none; border: 0; width: 100%; box-sizing: border-box; text-align: left; padding: 0.375rem 0.5rem; min-height: 44px; cursor: pointer; }
    .row:hover { background: #f6f6f6; }
    .row:focus-visible { outline: 2px solid #1a5fb4; outline-offset: -2px; }
    .row[aria-expanded="true"] .title { font-weight: 600; }
    .c-risk, .c-cve, .c-date { font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
    .c-cve, .c-title { overflow-wrap: anywhere; }
    .c-date { color: #666; }
    .pinned .title { font-weight: 600; }
    .pin, .orig { font-size: 0.75rem; padding: 0 0.25rem; border: 1px solid currentColor; }
    .pin { color: #a00; font-weight: 700; }
    .orig { color: #666; }
    .c-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .tag { font-size: 0.75rem; background: #f0f0f0; padding: 0 0.375rem; border-radius: 3px; overflow-wrap: anywhere; }
    .sev-critical, .kev { color: #a00; font-weight: 600; }
    .sev-high { color: #a35200; font-weight: 600; }
    .c-risk .kev { display: block; }
    .risk { font-weight: 700; padding: 0 0.375rem; }
    .risk-highest { background: #a00; color: #fff; }
    .risk-high { background: #e0a800; color: #000; }
    .risk-notice { background: #eee; color: #333; }
    .details { padding: 0.25rem 0.5rem 0.75rem 1.5rem; border-top: 1px dashed #ddd; }
    .details p { margin: 0.25rem 0 0; max-width: 60rem; overflow-wrap: anywhere; }
    .details .lead, .details .action { font-weight: 600; }
    .details .preparing { color: #666; font-size: 0.875rem; font-style: italic; }
    .details .devices { margin: 0.25rem 0 0; }
    .mentions { list-style: none; padding: 0; margin: 0.25rem 0 0; font-size: 0.875rem; color: #444; }
    .mentions li { overflow-wrap: anywhere; }
    .command button { font: inherit; font-size: 0.875rem; min-height: 44px; padding: 0 0.75rem; }
    .command code { background: #f3f3f3; padding: 0.25rem 0.5rem; overflow-wrap: anywhere; }
    @media (max-width: 767px) {
      #board-head { display: none; }
      .board { border-top: 2px solid #333; }
      .row { display: flex; flex-wrap: wrap; gap: 0.125rem 0.5rem; }
      .row .c-title { order: -1; flex-basis: 100%; }
      .c-risk .kev { display: inline; margin-left: 0.25rem; }
    }
    footer { border-top: 1px solid #ddd; margin-top: 1rem; padding-top: 0.5rem; }
  </style>
</head>
<body>
  <header><h1>vuln-radar</h1> <div id="views" role="group" data-t-aria="views"><button id="view-normal" type="button" aria-pressed="true" data-t="normal"></button><button id="view-easy" type="button" aria-pressed="false" data-t="easy"></button></div> <button id="lang" type="button"></button></header>
  <div id="filter">
    <label for="product-pick" data-t="products"></label>
    <input id="product-pick" list="product-options" data-t-placeholder="productsHint" autocomplete="off">
    <datalist id="product-options"></datalist>
    <div id="picks" data-t-aria="picked"></div>
    <label for="search" data-t="search"></label>
    <input id="search" type="search" data-t-placeholder="searchHint" autocomplete="off">
  </div>
  <p id="status" aria-live="polite"></p>
  <h2 data-t="all"></h2>
  <div id="board-head" class="cols" aria-hidden="true"><span data-t="colRisk"></span><span data-t="colCve"></span><span data-t="colTitle"></span><span data-t="colTags"></span><span data-t="colDate"></span></div>
  <ul id="board" class="board"></ul>
  <footer>
    <p lang="en">This product uses data from the NVD API but is not endorsed or certified by the NVD.</p>
    <p data-t="nvd"></p>
    <p data-t="kevNote"></p>
  </footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>
