<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vuln-radar</title>
  <script>try { const t = localStorage.getItem('vr-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <style>
    /* Graphite signage ground and its light twin; risk colours (red, amber, grey) are never used by Product lines. */
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f4f5f7, #121417);
      --panel: light-dark(#ffffff, #191c20);
      --panel-2: light-dark(#eceef1, #1f2328);
      --ink: light-dark(#16191d, #ececec);
      --ink-2: light-dark(#4f5862, #a8afb7);
      --ink-3: light-dark(#5f6872, #8c949d);
      --rule: light-dark(#dde1e5, #2a2f35);
      --rule-2: light-dark(#c4c9cf, #3a4048);
      --edge: light-dark(#858e97, #6b737c);
      --high: light-dark(#c4231c, #ff6b62);
      --mid: light-dark(#8f5c00, #f5b400);
      --note: light-dark(#5f6b76, #9aa3ad);
      --focus: light-dark(#1a5fb4, #7cc4ff);
      --shadow: light-dark(rgb(20 25 30 / 0.07), rgb(0 0 0 / 0.32));
      --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      --pre: 6.5rem;
      --gap: 1.25rem;
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); scrollbar-color: var(--rule-2) var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--sans); letter-spacing: -0.005em; word-break: keep-all; caret-color: var(--focus); -webkit-font-smoothing: antialiased; }
    ::selection { background: color-mix(in srgb, var(--focus) 32%, transparent); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button, input { font: inherit; color: inherit; }
    a { color: var(--focus); text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--focus) 50%, transparent); }
    .wrap { max-width: 75rem; margin: 0 auto; padding: 0 1rem; }
    @media (min-width: 768px) { .wrap { padding: 0 1.5rem; } }

    /* top bar: name, 기본|쉬운 설명, theme and language */
    .top { border-bottom: 1px solid var(--rule); }
    .top .wrap { min-height: 4rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.75rem; }
    h1 { margin: 0; display: flex; align-items: center; gap: 0.625rem; font: 700 1.25rem/1 var(--sans); letter-spacing: -0.02em; }
    h1 i { width: 0.875rem; height: 0.875rem; border-radius: 50%; border: 3px solid currentColor; }
    #views { display: inline-flex; padding: 3px; border: 1px solid var(--edge); border-radius: 999px; background: var(--panel-2); }
    #views button { min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font-weight: 500; cursor: pointer; }
    #views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
    .end { justify-self: end; display: flex; gap: 0.5rem; }
    #theme, #lang { min-height: 44px; min-width: 44px; padding: 0 1rem; border: 1px solid var(--edge); border-radius: 8px; background: none; font-size: 0.875rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    #theme { padding: 0; }
    #theme svg { width: 18px; height: 18px; }
    #theme[aria-pressed="true"] .sun, #theme[aria-pressed="false"] .moon { display: none; }
    #theme:hover, #lang:hover, #views button:not([aria-pressed="true"]):hover { background: var(--panel-2); color: var(--ink); }
    @media (max-width: 599px) {
      .top .wrap { grid-template-columns: 1fr auto; padding-block: 0.75rem; }
      #views { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
      #views button { flex: 1; }
    }

    /* product picker and search on one line */
    #filter { display: grid; grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); gap: 0.75rem; padding-top: 1.25rem; }
    .field { display: flex; align-items: center; gap: 0.75rem; min-height: 48px; padding: 0 0.875rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; }
    .field:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
    .field label { flex: none; font-weight: 700; font-size: 0.875rem; padding-right: 0.75rem; border-right: 1px solid var(--rule-2); }
    .field input { flex: 1; min-width: 0; min-height: 46px; border: 0; background: none; outline: 0; }
    .field input::placeholder { color: var(--ink-3); }
    .field svg { flex: none; width: 16px; height: 16px; color: var(--ink-3); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #picks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 0.375rem; }
    #picks:empty { display: none; }
    .chip { min-height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; }
    .chip .x { position: relative; width: 10px; height: 10px; margin-left: 0.5rem; }
    .chip .x::before, .chip .x::after { content: ""; position: absolute; left: 4px; top: -1px; width: 1.5px; height: 12px; background: currentColor; transform: rotate(45deg); }
    .chip .x::after { transform: rotate(-45deg); }
    @media (max-width: 767px) { #filter { grid-template-columns: 1fr; } }

    #status { margin: 0; padding: 1rem 0 0; font-size: 0.8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    h2 { margin: 1.75rem 0 0.625rem; font-size: 0.875rem; font-weight: 700; color: var(--ink-2); }
    h2 .n { font-variant-numeric: tabular-nums; color: var(--ink); margin-left: 0.25rem; }
    ol { list-style: none; margin: 0; padding: 0; }

    /* a row is a sign: risk dot and word, bold title over its other-language line, CVE, line badges, age */
    .row { display: grid; grid-template-columns: var(--pre) minmax(0, 1fr) 10.5rem minmax(0, 15rem) 5.5rem 0.75rem; grid-template-areas: "risk t id tags when chev"; align-items: center; column-gap: var(--gap); width: 100%; min-height: 4.5rem; padding: 0.75rem 0.75rem; border: 0; background: none; text-align: left; cursor: pointer; }
    .row:hover { background: var(--panel-2); }
    .c-risk { grid-area: risk; display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; font-weight: 700; }
    .dot { flex: none; width: 0.875rem; height: 0.875rem; border-radius: 50%; background: currentColor; }
    .risk-highest .c-risk, .risk-highest.c-risk { color: var(--high); }
    .risk-high .c-risk, .risk-high.c-risk { color: var(--mid); }
    .risk-notice .c-risk, .risk-notice.c-risk { color: var(--note); }
    .c-title { grid-area: t; min-width: 0; }
    .title { display: block; font-size: 1.0625rem; font-weight: 700; line-height: 1.35; letter-spacing: -0.02em; overflow-wrap: anywhere; text-wrap: pretty; }
    .sub { display: block; margin-top: 0.1875rem; font-size: 0.8125rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0; }
    .orig { display: inline-block; margin-right: 0.375rem; padding: 0.125rem 0.375rem; border: 1px solid var(--edge); border-radius: 4px; font-size: 0.6875rem; font-weight: 700; color: var(--ink-2); vertical-align: 0.125rem; }
    .c-id { grid-area: id; min-width: 0; font-variant-numeric: tabular-nums; }
    .c-cve { display: block; font-size: 0.875rem; font-weight: 500; overflow-wrap: anywhere; }
    .c-cve.none { color: var(--ink-2); font-weight: 400; }
    .sev { display: block; margin-top: 0.125rem; font-size: 0.75rem; color: var(--ink-2); }
    .sev-critical, .sev-high { color: var(--ink); font-weight: 600; }
    .kev { color: var(--high); font-weight: 700; }
    .c-tags { grid-area: tags; display: flex; flex-wrap: wrap; gap: 0.375rem; min-width: 0; }
    .ln { display: inline-flex; align-items: center; max-width: 100%; min-height: 1.625rem; padding: 0.1875rem 0.6875rem; border-radius: 999px; background: var(--line); color: var(--line-ink); font-size: 0.78125rem; font-weight: 600; line-height: 1.2; letter-spacing: 0; overflow-wrap: anywhere; }
    .c-date { grid-area: when; justify-self: end; font-size: 0.8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chev { grid-area: chev; width: 0.5rem; height: 0.5rem; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(-45deg); transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    [aria-expanded="true"] .chev { transform: rotate(45deg) translate(-2px, -2px); }

    /* 주목: stacked alerts, each framed and edged in its Risk colour, details inside the frame */
    .stack { display: grid; gap: 0.5rem; }
    .alert { background: var(--panel); border: 1px solid var(--rule-2); border-left: 3px solid var(--note); border-radius: 10px; box-shadow: 0 6px 18px -8px var(--shadow); overflow: hidden; }
    .alert.risk-highest { border-left-color: var(--high); background: linear-gradient(90deg, color-mix(in srgb, var(--high) 7%, transparent), transparent 40%), var(--panel); }
    .alert.risk-high { border-left-color: var(--mid); }
    .alert .row { padding-left: calc(0.75rem - 2px); }

    /* 최신순: plain rows on one hairline each */
    .list { border-top: 1px solid var(--rule-2); }
    .list > li { border-bottom: 1px solid var(--rule); }
    .list .row[aria-expanded="true"], .list .details { background: var(--panel); }

    .details { padding: 0.25rem 2.5rem 1.25rem calc(0.75rem + var(--pre) + var(--gap)); }
    .details p { margin: 0.5rem 0 0; max-width: 46rem; overflow-wrap: anywhere; line-height: 1.7; }
    .details .summary, .details .easy { margin-top: 0; font-size: 0.9375rem; }
    .details .conditions, .details .mitigation { font-size: 0.875rem; }
    .details .lead, .details .action { font-weight: 600; }
    .details .kev { color: var(--high); }
    .details .preparing { color: var(--ink-2); font-size: 0.875rem; }
    .details .devices { margin: 0.25rem 0 0; padding-left: 1.25rem; }
    .mentions { list-style: none; padding: 0.75rem 0 0; margin: 0.75rem 0 0; border-top: 1px solid var(--rule); font-size: 0.8125rem; color: var(--ink-2); max-width: 46rem; }
    .mentions li { overflow-wrap: anywhere; padding: 0.125rem 0; }
    .command { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .command code { font: 0.875rem/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 6px; padding: 0.375rem 0.625rem; overflow-wrap: anywhere; }
    .command button { min-height: 44px; padding: 0 0.875rem; border: 1px solid var(--edge); border-radius: 8px; background: none; font-size: 0.875rem; cursor: pointer; }
    .command button:hover { background: var(--panel-2); }

    @media (max-width: 767px) {
      .row { grid-template-columns: minmax(0, 1fr) auto 0.75rem; grid-template-areas: "risk when chev" "t t t" "id id id" "tags tags tags"; row-gap: 0.375rem; padding: 0.875rem 0.5rem; }
      .alert .row { padding-left: calc(0.75rem - 2px); }
      .sub { white-space: normal; }
      .c-id { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; }
      .sev { margin: 0; }
      .details { padding: 0 0.75rem 1rem; }
    }
    @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

    footer { margin-top: 2.5rem; border-top: 1px solid var(--rule); padding: 1rem 0 2.5rem; font-size: 0.8125rem; color: var(--ink-2); }
    footer p { margin: 0.25rem 0 0; max-width: 46rem; }
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <h1><i aria-hidden="true"></i>vuln-radar</h1>
    <div id="views" role="group" data-t-aria="views"><button id="view-normal" type="button" aria-pressed="true" data-t="normal"></button><button id="view-easy" type="button" aria-pressed="false" data-t="easy"></button></div>
    <div class="end">
      <button id="theme" type="button" aria-pressed="false" data-t-aria="theme"><svg class="moon" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 11.2A6 6 0 0 1 6.8 3.5a6 6 0 1 0 7.7 7.7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><svg class="sun" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button id="lang" type="button"></button>
    </div>
  </div></header>
  <main class="wrap">
    <div id="filter">
      <div class="field"><label for="product-pick" data-t="products"></label><input id="product-pick" list="product-options" data-t-placeholder="productsHint" autocomplete="off"></div>
      <datalist id="product-options"></datalist>
      <div class="field"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><label for="search" class="sr-only" data-t="search"></label><input id="search" type="search" data-t-placeholder="searchHint" autocomplete="off"></div>
      <div id="picks" data-t-aria="picked"></div>
    </div>
    <p id="status" aria-live="polite"></p>
    <section id="pinned" aria-labelledby="pinned-head" hidden>
      <h2 id="pinned-head"></h2>
      <ol id="highlights" class="stack"></ol>
    </section>
    <h2 id="all-head" data-t="all"></h2>
    <ol id="board" class="list" aria-labelledby="all-head"></ol>
  </main>
  <footer><div class="wrap">
    <p lang="en">This product uses data from the NVD API but is not endorsed or certified by the NVD.</p>
    <p data-t="nvd"></p>
    <p data-t="kevNote"></p>
  </div></footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>
