<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vuln-radar</title>
  <script>try { const t = localStorage.getItem('vr-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    const s = Number(localStorage.getItem('vr-text-pct')); if ([87.5, 112.5, 125, 150].includes(s)) document.documentElement.style.setProperty('--ts', s / 100); } catch {}</script>
  <style>
    /* Graphite signage ground and its light twin; risk colours (red, amber, grey) are never used by Product lines. */
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f4f5f7, #121417);
      --panel: light-dark(#ffffff, #191c20);
      --panel-2: light-dark(#eceef1, #1f2328);
      --ink: light-dark(#16191d, #ececec);
      --ink-2: light-dark(#4f5862, #a8afb7);
      --ink-3: light-dark(#5f6872, #8c949d);
      --rule: light-dark(#dde1e5, #2a2f35);
      --rule-2: light-dark(#c4c9cf, #3a4048);
      --edge: light-dark(#858e97, #6b737c);
      --high: light-dark(#c4231c, #ff6b62);
      --mid: light-dark(#8f5c00, #f5b400);
      --note: light-dark(#5f6b76, #9aa3ad);
      --focus: light-dark(#1a5fb4, #7cc4ff);
      --shadow: light-dark(rgb(20 25 30 / 0.07), rgb(0 0 0 / 0.32));
      --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      --pre: 6.5rem;
      --gap: 1.25rem;
      /* --tap: smallest touch target (44 px, PRODUCT.md). --r-frame: fields and Highlight frames; --r-ctl: buttons.
         --fs-meta: status, dates, secondary lines; --fs-small: labels, controls, detail text. */
      --ts: 1; /* text scale from the 가−/가+ buttons: only font sizes use it, layout stays */
      --tap: 44px;
      --r-pill: 999px;
      --r-frame: 10px;
      --r-ctl: 8px;
      --fs-meta: 0.8125rem;
      --fs-small: 0.875rem;
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); scrollbar-color: var(--rule-2) var(--bg); scrollbar-gutter: stable; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 calc(0.9375rem * var(--ts))/1.55 var(--sans); letter-spacing: -0.005em; word-break: keep-all; caret-color: var(--focus); -webkit-font-smoothing: antialiased; }
    ::selection { background: color-mix(in srgb, var(--focus) 32%, transparent); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button, input { font: inherit; color: inherit; }
    a { color: var(--focus); text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--focus) 50%, transparent); }
    .wrap { max-width: 75rem; margin: 0 auto; padding: 0 1rem; }
    @media (min-width: 768px) { .wrap { padding: 0 1.5rem; } }

    /* top bar: name, 기본|쉬운 설명, theme and language */
    .top { border-bottom: 1px solid var(--rule); }
    .top .wrap { min-height: 4rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.75rem; }
    h1 { margin: 0; display: flex; align-items: center; gap: 0.625rem; font: 700 calc(1.25rem * var(--ts))/1 var(--sans); letter-spacing: -0.02em; }
    h1 i { width: 0.875rem; height: 0.875rem; border-radius: 50%; border: 3px solid currentColor; }
    #views { display: inline-flex; padding: 3px; border: 1px solid var(--edge); border-radius: var(--r-pill); background: var(--panel-2); }
    #views button { min-height: var(--tap); padding: 0 1.25rem; border: 0; border-radius: var(--r-pill); background: none; color: var(--ink-2); font-weight: 500; cursor: pointer; }
    #views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
    .end { justify-self: end; display: flex; gap: 0.5rem; }
    /* outlined button: theme, language, copy command */
    .btn { min-height: var(--tap); min-width: var(--tap); padding: 0 1rem; border: 1px solid var(--edge); border-radius: var(--r-ctl); background: none; font-size: calc(var(--fs-small) * var(--ts)); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .btn:hover { background: var(--panel-2); color: var(--ink); }
    #theme { padding: 0; }
    /* text size: 가− and 가+ in one outline, the glyph grows left to right (px, so the
       control itself does not jump); everything else is rem, so the root size scales the Board */
    .sizes { display: inline-flex; border: 1px solid var(--edge); border-radius: var(--r-ctl); overflow: hidden; }
    .sizes button { min-width: var(--tap); min-height: var(--tap); padding: 0; border: 0; background: none; font-weight: 700; line-height: 1; cursor: pointer; }
    .sizes button + button { border-left: 1px solid var(--rule-2); }
    .sizes button:hover:not(:disabled) { background: var(--panel-2); }
    .sizes button:disabled { color: var(--ink-3); cursor: default; }
    .sizes b { margin-left: 1px; font-size: 10px; }
    .sizes .g1 { font-size: 12px; }
    .sizes .g3 { font-size: 18px; }
    #lang .short { display: none; }
    @media (max-width: 599px) { #lang .full { display: none; } #lang .short { display: inline; } h1 { white-space: nowrap; } } /* the header fits 375px */
    #theme svg { width: 18px; height: 18px; }
    #theme[aria-pressed="true"] .sun, #theme[aria-pressed="false"] .moon { display: none; }
    #views button:not([aria-pressed="true"]):hover { background: var(--panel-2); color: var(--ink); }
    @media (max-width: 599px) {
      .top .wrap { grid-template-columns: 1fr auto; padding-block: 0.75rem; }
      #views { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
      #views button { flex: 1; }
    }

    /* product picker and search on one line */
    #filter { display: grid; grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); gap: 0.75rem; padding-top: 1.25rem; }
    .field { display: flex; align-items: center; gap: 0.75rem; min-height: 48px; padding: 0 0.875rem; background: var(--panel); border: 1px solid var(--edge); border-radius: var(--r-frame); }
    .field:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
    .field label { flex: none; font-weight: 700; font-size: calc(var(--fs-small) * var(--ts)); padding-right: 0.75rem; border-right: 1px solid var(--rule-2); }
    .field input { flex: 1; min-width: 0; min-height: 46px; border: 0; background: none; outline: 0; }
    .field input::placeholder { color: var(--ink-3); }
    .field svg { flex: none; width: 16px; height: 16px; color: var(--ink-3); }
    /* skip link: out of sight until a keyboard user reaches it */
    .skip { position: absolute; left: -9999px; }
    .skip:focus { position: static; display: inline-block; margin-top: 0.75rem; padding: 0.5rem 0.75rem; border: 1px solid var(--edge); border-radius: var(--r-ctl); background: var(--panel); }
    #all-head:focus { outline: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    /* 주목 line: the group heading on the left, the 필터 button on the right */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 1.25rem 0 0.625rem; }
    .bar h2 { margin: 0; }
    #filter-btn { gap: 0.5rem; padding: 0 1rem; margin-left: auto; } /* stays at the right even when 주목 is empty */
    .cond { display: inline-flex; align-items: center; gap: 0.5rem; min-height: var(--tap); padding: 0 0.75rem; border: 1px solid var(--rule-2); border-radius: var(--r-pill); background: var(--panel-2); font-size: calc(var(--fs-small) * var(--ts)); font-weight: 600; cursor: pointer; }
    .cond .x { position: relative; width: 10px; height: 10px; }
    .cond .x::before, .cond .x::after { content: ""; position: absolute; left: 4px; top: -1px; width: 1.5px; height: 12px; background: currentColor; transform: rotate(45deg); }
    .cond .x::after { transform: rotate(-45deg); }
    #filter-btn svg { width: 16px; height: 16px; }
    #filter-btn[aria-expanded="true"] { background: var(--panel-2); }
    .count { min-width: 1.375rem; padding: 0 0.375rem; border-radius: var(--r-pill); background: var(--focus); color: var(--bg); font-size: calc(0.75rem * var(--ts)); font-weight: 700; line-height: 1.375rem; text-align: center; }
    /* advanced filter panel */
    .filters { margin-bottom: 1.25rem; padding: 1.25rem; background: var(--panel); border: 1px solid var(--rule-2); border-radius: var(--r-frame); }
    .fp-title { margin: 0 0 1rem; font-size: calc(var(--fs-small) * var(--ts)); font-weight: 700; }
    .fp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem 1.25rem; }
    .fp-field { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; margin: 0; padding: 0; border: 0; }
    .fp-field.wide { grid-column: 1 / -1; }
    .fp-label { padding: 0; font-size: calc(var(--fs-meta) * var(--ts)); font-weight: 600; color: var(--ink-2); }
    .fp-field input, .fp-field select { min-height: var(--tap); padding: 0 0.75rem; border: 1px solid var(--edge); border-radius: var(--r-ctl); background: var(--bg); }
    .fp-checks { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .fp-checks legend { flex-basis: 100%; margin-bottom: 0.375rem; }
    .fp-chip { position: relative; display: inline-flex; }
    .fp-chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .fp-chip span { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 0.875rem; border: 1px solid var(--rule-2); border-radius: var(--r-pill); font-size: calc(var(--fs-small) * var(--ts)); font-weight: 500; color: var(--ink-2); }
    .fp-chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
    .fp-chip.risk-highest input:checked + span { background: var(--high); border-color: var(--high); }
    .fp-chip.risk-high input:checked + span { background: var(--mid); border-color: var(--mid); }
    .fp-chip input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
    .fp-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
    .btn.primary:hover { background: var(--ink-2); }
    /* phones: the panel is a bottom sheet with 필터 적용 always in reach */
    @media (max-width: 599px) {
      .filters { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 85vh; overflow-y: auto; margin: 0; border-radius: var(--r-frame) var(--r-frame) 0 0; padding-bottom: 0; }
      .fp-actions { position: sticky; bottom: 0; margin: 1rem -1.25rem 0; padding: 0.75rem 1.25rem; background: var(--panel); }
    }
    #picks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
    #picks:empty { display: none; }
    .chip { min-height: var(--tap); padding: 0; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; }
    .chip .x { position: relative; width: 10px; height: 10px; margin-left: 0.5rem; }
    .chip .x::before, .chip .x::after { content: ""; position: absolute; left: 4px; top: -1px; width: 1.5px; height: 12px; background: currentColor; transform: rotate(45deg); }
    .chip .x::after { transform: rotate(-45deg); }
    @media (max-width: 767px) { #filter { grid-template-columns: 1fr; } }

    #status { margin: 0; padding: 1rem 0 0; font-size: calc(var(--fs-meta) * var(--ts)); color: var(--ink-2); font-variant-numeric: tabular-nums; }
    h2 { margin: 1.75rem 0 0.625rem; font-size: calc(var(--fs-small) * var(--ts)); font-weight: 700; color: var(--ink-2); }
    h2 .n { font-variant-numeric: tabular-nums; color: var(--ink); margin-left: 0.25rem; }
    ol { list-style: none; margin: 0; padding: 0; }

    /* a row is a sign: risk dot and word, the CVE ID as the bold name over the title, CVSS ring, line badges, age */
    .row { display: grid; grid-template-columns: var(--pre) minmax(0, 1fr) 7.5rem minmax(0, 15rem) 5.5rem 0.75rem; grid-template-areas: "risk t score tags when chev"; align-items: center; column-gap: var(--gap); width: 100%; min-height: 4.5rem; padding: 0.75rem 0.75rem; border: 0; background: none; text-align: left; cursor: pointer; }
    .row:hover { background: var(--panel-2); }
    .c-risk { grid-area: risk; display: flex; align-items: center; gap: 0.5rem; font-size: calc(var(--fs-meta) * var(--ts)); font-weight: 700; }
    .c-risk { flex-wrap: wrap; row-gap: 0.125rem; }
    .why.kev { color: var(--high); font-weight: 700; }
    .why { flex-basis: 100%; padding-left: 1.375rem; font-size: calc(0.75rem * var(--ts)); font-weight: 500; color: var(--ink-2); }
    .dot { flex: none; width: 0.875rem; height: 0.875rem; border-radius: 50%; background: currentColor; }
    .risk-highest .c-risk, .risk-highest.c-risk { color: var(--high); }
    .risk-high .c-risk, .risk-high.c-risk { color: var(--mid); }
    .risk-notice .c-risk, .risk-notice.c-risk { color: var(--note); }
    .c-title { grid-area: t; min-width: 0; }
    .title { display: block; font-size: calc(1.0625rem * var(--ts)); font-weight: 700; line-height: 1.35; letter-spacing: -0.02em; overflow-wrap: anywhere; text-wrap: pretty; }
    .sub { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; margin-top: 0.1875rem; font-size: calc(var(--fs-small) * var(--ts)); line-height: 1.45; color: var(--ink-2); letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .sub.say { display: block; color: var(--ink); font-weight: 500; } /* Easy view: the whole plain sentence, never cut */
    .cve { font-variant-numeric: tabular-nums; }
    .cve.none { color: var(--ink-2); }
    .more { font-size: calc(var(--fs-meta) * var(--ts)); font-weight: 500; color: var(--ink-2); }
    .orig { display: inline-block; margin-right: 0.375rem; padding: 0.125rem 0.375rem; border: 1px solid var(--edge); border-radius: 4px; font-size: calc(0.6875rem * var(--ts)); font-weight: 700; color: var(--ink-2); vertical-align: 0.125rem; }
    /* CVSS ring: the arc fills to the score out of 10 and takes its rating's colour; the number sits inside */
    .c-score { grid-area: score; display: flex; align-items: center; gap: 0.625rem; min-width: 0; }
    .gauge { position: relative; flex: none; width: 2.75rem; height: 2.75rem; display: grid; place-items: center; color: var(--note); }
    .gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge circle { fill: none; stroke-width: 3.5; }
    .gauge .track { stroke: var(--rule-2); }
    .gauge .arc { stroke: currentColor; stroke-dasharray: var(--fill) 1; stroke-linecap: round; }
    .gauge.sev-none .arc { display: none; }
    .num { position: relative; font-size: var(--fs-meta); /* fixed: the ring is a graphic and does not grow, so its number must not either */ font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    /* the ring speaks the Risk alphabet: same severity, same colour as the dot (a separate orange read as the amber dot) */
    .sev-critical { color: var(--high); }
    .sev-high { color: var(--mid); }
    .sev-medium, .sev-low, .sev-none { color: var(--note); }
    .sev.unrated { color: var(--ink-3); }
    .sev { display: flex; flex-direction: column; font-size: calc(var(--fs-meta) * var(--ts)); line-height: 1.35; color: var(--ink-2); white-space: nowrap; }
    .kev { color: var(--high); font-weight: 700; }
    .c-tags { grid-area: tags; display: flex; flex-wrap: wrap; gap: 0.375rem; min-width: 0; }
    .ln { display: inline-flex; align-items: center; max-width: 100%; min-height: 1.625rem; padding: 0.1875rem 0.6875rem; border-radius: var(--r-pill); background: var(--line); color: var(--line-ink); font-size: calc(0.78125rem * var(--ts)); font-weight: 600; line-height: 1.2; letter-spacing: 0; overflow-wrap: anywhere; }
    .c-date { grid-area: when; justify-self: end; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.35; font-size: calc(var(--fs-meta) * var(--ts)); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chev { grid-area: chev; width: 0.5rem; height: 0.5rem; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(-45deg); transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    [aria-expanded="true"] .chev { transform: rotate(45deg) translate(-2px, -2px); }

    /* 주목: stacked alerts, each framed and edged in its Risk colour, details inside the frame */
    .stack { display: grid; gap: 0.5rem; }
    .alert { background: var(--panel); border: 1px solid var(--rule-2); border-left: 3px solid var(--note); border-radius: var(--r-frame); box-shadow: 0 6px 18px -8px var(--shadow); overflow: hidden; }
    .alert.risk-highest { border-left-color: var(--high); background: linear-gradient(90deg, color-mix(in srgb, var(--high) 7%, transparent), transparent 40%), var(--panel); }
    .alert.risk-high { border-left-color: var(--mid); }
    .alert .row { padding-left: calc(0.75rem - 2px); }

    /* 최신순: plain rows on one hairline each */
    .list { border-top: 1px solid var(--rule-2); }
    .list > li { border-bottom: 1px solid var(--rule); }
    .list .row[aria-expanded="true"], .list .details { background: var(--panel); }

    .details { padding: 0.25rem 2.5rem 1.25rem calc(0.75rem + var(--pre) + var(--gap)); }
    .details p { margin: 0.5rem 0 0; max-width: 46rem; overflow-wrap: anywhere; line-height: 1.7; }
    .details .summary, .details .easy { margin-top: 0; font-size: calc(0.9375rem * var(--ts)); }
    .details .conditions, .details .mitigation { font-size: calc(0.9375rem * var(--ts)); }
    .details .lead, .details .action { font-weight: 600; }
    .details .kev { color: var(--high); }
    .details .cve-line { margin-top: 0; font-size: calc(var(--fs-small) * var(--ts)); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .details .caution { color: var(--mid); font-size: calc(var(--fs-small) * var(--ts)); font-weight: 600; }
    .more { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 1rem; }
    .more:empty { display: none; }
    .empty { margin-top: 1.75rem; padding: 1.5rem 0; border-top: 1px solid var(--rule-2); }
    .empty p { margin: 0; font-size: calc(1.0625rem * var(--ts)); font-weight: 600; max-width: 46rem; }
    .empty .scope { margin-top: 0.375rem; font-size: calc(var(--fs-small) * var(--ts)); font-weight: 400; color: var(--ink-2); }
    .empty .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; font-weight: 400; }
    .details .preparing { color: var(--ink-2); font-size: calc(var(--fs-small) * var(--ts)); }
    .details .devices { margin: 0.25rem 0 0; padding-left: 1.25rem; }
    .mentions { list-style: none; padding: 0.75rem 0 0; margin: 0.75rem 0 0; border-top: 1px solid var(--rule); font-size: calc(var(--fs-meta) * var(--ts)); color: var(--ink-2); max-width: 46rem; }
    .mentions li { overflow-wrap: anywhere; padding: 0.125rem 0; }
    @media (pointer: coarse) { .mentions li a { display: inline-block; padding: 0.625rem 0; } } /* finger-sized links on touch screens */
    .command { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .command code { font: calc(var(--fs-small) * var(--ts))/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 6px; padding: 0.375rem 0.625rem; overflow-wrap: anywhere; }

    @media (max-width: 767px) {
      /* phone: the CVSS ring joins the risk and date line, so each row is one line shorter */
      .row { grid-template-columns: minmax(0, 1fr) auto auto 0.75rem; grid-template-areas: "risk score when chev" "t t t t" "tags tags tags tags"; column-gap: 0.625rem; row-gap: 0.375rem; padding: 0.875rem 0.5rem; }
      .c-score { gap: 0.375rem; }
      .c-score .sev { display: none; }
      .alert .row { padding-left: calc(0.75rem - 2px); }
      .details { padding: 0 0.75rem 1rem; }
      .c-date { flex-direction: row; gap: 0.375rem; }
    }
    @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

    footer { margin-top: 2.5rem; border-top: 1px solid var(--rule); padding: 1rem 0 2.5rem; font-size: calc(var(--fs-meta) * var(--ts)); color: var(--ink-2); }
    footer p { margin: 0.25rem 0 0; max-width: 46rem; }
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <h1><i aria-hidden="true"></i>vuln-radar</h1>
    <div id="views" role="group" data-t-aria="views"><button id="view-normal" type="button" aria-pressed="true" data-t="normal"></button><button id="view-easy" type="button" aria-pressed="false" data-t="easy"></button></div>
    <div class="end">
      <div class="sizes" role="group" data-t-aria="textSizeGroup">
        <button id="text-down" type="button" data-t-aria="textDown"><span aria-hidden="true" class="g1">가<b>−</b></span></button>
        <button id="text-up" type="button" data-t-aria="textUp"><span aria-hidden="true" class="g3">가<b>+</b></span></button>
      </div>
      <button id="theme" class="btn" type="button" aria-pressed="false" data-t-aria="theme"><svg class="moon" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 11.2A6 6 0 0 1 6.8 3.5a6 6 0 1 0 7.7 7.7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><svg class="sun" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button id="lang" class="btn" type="button"></button>
    </div>
  </div></header>
  <main class="wrap">
    <div id="filter">
      <div class="field"><label for="product-pick" data-t="products"></label><input id="product-pick" list="product-options" data-t-placeholder="productsHint" autocomplete="off"></div>
      <datalist id="product-options"></datalist>
      <div class="field"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><label for="search" class="sr-only" data-t="search"></label><input id="search" type="search" data-t-placeholder="searchHint" autocomplete="off"></div>
      <div id="picks" data-t-aria="picked"></div>
    </div>
    <p id="status"></p>
    <p id="announce" class="sr-only" aria-live="polite"></p>
    <a id="skip" class="skip" href="#all-head" data-t="skip" hidden></a>
    <div class="bar">
      <h2 id="pinned-head"></h2>
      <button id="filter-btn" class="btn" type="button" aria-controls="filters" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3 1.5V8.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span data-t="filterBtn"></span><span id="filter-count" class="count" hidden></span></button>
    </div>
    <form id="filters" class="filters" hidden></form>
    <section id="pinned" aria-labelledby="pinned-head" hidden>
      <ol id="highlights" class="stack"></ol>
      <div id="pin-more" class="more"></div>
    </section>
    <div id="empty" class="empty" role="status" hidden></div>
    <h2 id="all-head" data-t="all" tabindex="-1"></h2>
    <ol id="board" class="list" aria-labelledby="all-head"></ol>
    <div id="more" class="more"></div>
  </main>
  <footer><div class="wrap">
    <p lang="en">This product uses data from the NVD API but is not endorsed or certified by the NVD.</p>
    <p data-t="nvd"></p>
    <p data-t="kevNote"></p>
  </div></footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>
