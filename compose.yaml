# Live collector: a cycle on every 10-minute mark of the clock (:00, :10, ... UTC), writing to R2. A restart or a
# redeploy keeps the marks (owner, 11-09: "제깍제깍"); a cycle that runs past a mark waits for the next one.
#   docker compose up -d --build              start the schedule
#   docker compose run --rm collector python -m collector   one cycle now (plain `run` starts the loop)
#   docker compose logs -f collector          watch it
#   docker compose run --rm -T --no-deps collector python -m collector --smoke   one small real request of every
#                                             request shape; exit 1 when Anthropic rejects one (run it before a recreate)
# SQLite backup of every document in ./backup (create it once: mkdir backup && sudo chown 65534 backup, since the
# image runs as nobody). Seed it once: docker compose run --rm collector python -m collector --seed-backup
# Rebuild R2 from it:             docker compose run --rm collector python -m collector --restore
services:
  collector:
    build: .
    image: vuln-radar-collector
    env_file: .env  # VR_COLLECTOR_ID, VR_CONTACT, the four VR_R2_* settings, ANTHROPIC_API_KEY; leave VR_STORE_DIR empty
    environment:
      VR_BACKUP_DB: /backup/store.sqlite
    volumes:
      - ./backup:/backup
    restart: unless-stopped
    # A failed cycle is logged and the next one runs on time; the loop itself never exits.
    # A cycle is stopped after 50 min (audit run-1: one that hangs blocked every later one): the slowest real cycles,
    # 500-record backfills, took 30-40 min, and a stopped cycle writes no checkpoint, so the limit must stay above them.
    command:
      - sh
      - -c
      - |
        while :; do
          sleep $$((600 - $$(date +%s) % 600))
          timeout -k 60 3000 python -m collector || { c=$$?; if [ $$c = 124 ]; then echo "cycle timed out after 3000 s"; else echo "cycle failed with exit $$c"; fi; }
        done
